<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Expense Tracker</title>
  </head>
  <body>
    <h1>Trip Expense Tracker</h1>

    <nav><a href="/">All Trips</a></nav>
    <p id="message"></p>

    <section id="trips-page" hidden>
      <h2>Saved Trips</h2>
      <button type="button" onclick="location.href='/trips/new'">New Trip</button>
      <ul id="trip-list"></ul>
    </section>

    <section id="setup-page" hidden>
    <h2 id="setup-title">New Trip</h2>
    <form id="trip-form">
      <label for="trip-name">Trip name:</label>
      <input id="trip-name" required />
      <button type="submit">Create Trip</button>
    </form>

    <div id="participant-setup" hidden>
    <h2>Add a Participant</h2>
    <form id="participant-form">
      <label for="participant-name">Name:</label>
      <input id="participant-name" required />

      <button type="submit">Add Participant</button>
    </form>

    <p id="participant-message"></p>

    <ul id="setup-participant-list"></ul>
    <a id="view-expenses" href="/">Continue to Expenses</a>
    </div>
    </section>

    <section id="expenses-page" hidden>
    <h2 id="expense-trip-name"></h2>
    <h3>Participants &amp; Balances</h3>
    <ul id="participant-list"></ul>
    <a id="edit-participants" href="/">Add Participants</a>

    <h3>Expenses</h3>
    <ul id="expense-list"></ul>
    <button id="show-expense-form" type="button">Add Expense</button>
    <form id="expense-form" hidden>
      <label for="expense-description">Description:</label>
      <input id="expense-description" required />

      <label for="expense-amount">Amount:</label>
      <input id="expense-amount" type="number" min="0.01" step="0.01" required />

      <label for="paid-by">Paid by:</label>
      <select id="paid-by" required></select>

      <p>Split between:</p>
      <div id="expense-participants"></div>

      <button type="submit">Add Expense</button>
    </form>

    <p id="expense-message"></p>

    <button id="settle-balances" type="button">Settle Up</button>
    <ul id="settlement-list"></ul>
    </section>

    <script>
      const form = document.getElementById("trip-form");
      const tripName = document.getElementById("trip-name");
      const message = document.getElementById("message");
      const tripList = document.getElementById("trip-list");
      const participantForm = document.getElementById("participant-form");
      const tripRoute = location.pathname.match(/^\/trips\/(\d+)(\/setup)?\/?$/);
      const selectedTripId = tripRoute ? tripRoute[1] : "";
      const isSetup = location.pathname === "/trips/new" || Boolean(tripRoute?.[2]);
      document.getElementById("trips-page").hidden = isSetup || Boolean(selectedTripId);
      document.getElementById("setup-page").hidden = !isSetup;
      document.getElementById("expenses-page").hidden = isSetup || !selectedTripId;
      form.hidden = Boolean(selectedTripId);
      document.getElementById("participant-setup").hidden = !selectedTripId;
      document.getElementById("view-expenses").href = `/trips/${selectedTripId}`;
      document.getElementById("edit-participants").href = `/trips/${selectedTripId}/setup`;
      const participantName = document.getElementById("participant-name");
      const participantMessage = document.getElementById("participant-message");
      const participantList = document.getElementById("participant-list");
      const expenseForm = document.getElementById("expense-form");
      const expenseDescription = document.getElementById("expense-description");
      const expenseAmount = document.getElementById("expense-amount");
      const paidBy = document.getElementById("paid-by");
      const expenseParticipants = document.getElementById("expense-participants");
      const expenseMessage = document.getElementById("expense-message");
      const expenseList = document.getElementById("expense-list");
      const settleBalancesButton = document.getElementById("settle-balances");
      const settlementList = document.getElementById("settlement-list");

      async function loadSettlements() {
        const tripId = selectedTripId;
        settlementList.innerHTML = "";

        if (!tripId) return;

        const response = await fetch(`/api/settlements?trip_id=${tripId}`);
        const settlements = await response.json();

        if (settlements.length === 0) {
          settlementList.textContent = "Everyone is settled up.";
          return;
        }

        for (const settlement of settlements) {
          const listItem = document.createElement("li");
          listItem.textContent = `${settlement.from} pays ${settlement.to} $${(settlement.amount / 100).toFixed(2)}`;
          settlementList.appendChild(listItem);
        }
      }

      async function loadExpenses() {
        const tripId = selectedTripId;
        expenseList.innerHTML = "";

        if (!tripId) return;

        const response = await fetch(`/api/expenses?trip_id=${tripId}`);
        const expenses = await response.json();

        for (const expense of expenses) {
          const listItem = document.createElement("li");
          const dollars = (expense.amount / 100).toFixed(2);
          const sharedBy = expense.shared_by_names || "no one selected";
          listItem.textContent = `${expense.description}: $${dollars}, paid by ${expense.paid_by_name}, shared by ${sharedBy}`;
          expenseList.appendChild(listItem);
        }
      }

      async function loadParticipants() {
        const tripId = selectedTripId;
        participantList.innerHTML = "";
        document.getElementById("setup-participant-list").innerHTML = "";
        paidBy.innerHTML = "";
        expenseParticipants.innerHTML = "";

        if (!tripId) return;

        const response = await fetch(`/api/participants?trip_id=${tripId}`);
        const participants = await response.json();

        for (const participant of participants) {
          const listItem = document.createElement("li");
          listItem.textContent = `${participant.name}: $${(participant.balance / 100).toFixed(2)}`;
          participantList.appendChild(listItem);
          const setupItem = document.createElement("li");
          setupItem.textContent = participant.name;
          document.getElementById("setup-participant-list").appendChild(setupItem);

          const option = document.createElement("option");
          option.value = participant.id;
          option.textContent = participant.name;
          paidBy.appendChild(option);

          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = participant.id;
          checkbox.checked = true;
          label.appendChild(checkbox);
          label.append(` ${participant.name}`);
          expenseParticipants.appendChild(label);
        }
      }

      async function loadTrips() {
        const response = await fetch("/api/trips");
        const trips = await response.json();

        tripList.innerHTML = "";


        for (const trip of trips) {
          const listItem = document.createElement("li");
          const link = document.createElement("a");
          link.href = `/trips/${trip.id}`;
          link.textContent = trip.name;
          listItem.appendChild(link);
          tripList.appendChild(listItem);

          if (String(trip.id) === selectedTripId) {
            document.getElementById("expense-trip-name").textContent = trip.name;
            document.getElementById("setup-title").textContent = trip.name;
          }
        }

        loadParticipants();
        loadExpenses();
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const response = await fetch("/api/trips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: tripName.value })
        });

        const trip = await response.json();
        location.href = `/trips/${trip.id}/setup`;
      });

      participantForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const response = await fetch("/api/participants", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: participantName.value,
            trip_id: Number(selectedTripId)
          })
        });

        const participant = await response.json();
        participantMessage.textContent = `Added participant: ${participant.name}`;
        participantName.value = "";
        loadParticipants();
      });

      document.getElementById("show-expense-form").addEventListener("click", () => {
        expenseForm.hidden = !expenseForm.hidden;
        if (!expenseForm.hidden) expenseDescription.focus();
      });

      settleBalancesButton.addEventListener("click", loadSettlements);

      expenseForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const selectedPeople = expenseParticipants.querySelectorAll(
          "input:checked"
        );
        const participantIds = Array.from(selectedPeople).map((checkbox) =>
          Number(checkbox.value)
        );

        if (participantIds.length === 0) {
          expenseMessage.textContent = "Select at least one person to split between.";
          return;
        }

        const response = await fetch("/api/expenses", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            description: expenseDescription.value,
            amount: Math.round(Number(expenseAmount.value) * 100),
            trip_id: Number(selectedTripId),
            paid_by: Number(paidBy.value),
            participant_ids: participantIds
          })
        });

        const expense = await response.json();
        expenseMessage.textContent = `Added expense: ${expense.description}`;
        expenseDescription.value = "";
        expenseAmount.value = "";
        expenseForm.hidden = true;
        settlementList.innerHTML = "";
        loadParticipants();
        loadExpenses();
      });

      loadTrips();
    </script>
  </body>
</html>
