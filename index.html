<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trip Expense Tracker</title>
  </head>
  <body>
    <h1>Trip Expense Tracker</h1>

    <form id="trip-form">
      <label for="trip-name">Trip name:</label>
      <input id="trip-name" required />
      <button type="submit">Create Trip</button>
    </form>

    <p id="message"></p>

    <script>
      const form = document.getElementById("trip-form");
      const tripName = document.getElementById("trip-name");
      const message = document.getElementById("message");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const response = await fetch("/api/trips", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: tripName.value })
        });

        const trip = await response.json();
        message.textContent = `Created trip: ${trip.name}`;
        tripName.value = "";
      });
    </script>
  </body>
</html>
